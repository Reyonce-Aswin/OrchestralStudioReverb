name: Windows build and DSP tests

on:
  push:
    branches: [main, master, 'fix/**', 'feature/**', 'preview/full-plugin-1000x700', 'vst/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows / MSVC / Release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (JUCE 8.0.6)
        run: >
          cmake -S . -B build -A x64
          -DOSR_FETCH_JUCE=ON
          -DOSR_BUILD_VST3=ON
          -DOSR_BUILD_TESTS=ON

      - name: Build plugin and DSP tests
        run: cmake --build build --config Release --parallel

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3 plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrchestralStudioReverb-Windows-VST3
          path: build/OrchestralStudioReverb_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
          retention-days: 14

      - name: Upload full plugin UI preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrchestralStudioReverb-Full-UI-Preview-Windows
          path: build/OrchestralStudioReverbFullPreview_artefacts/Release/*.exe
          if-no-files-found: error
          retention-days: 14
