name: Windows VST3 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin and run DSP tests
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DOSR_FETCH_JUCE=ON
          -DOSR_BUILD_TESTS=ON
          -DOSR_BUILD_VST3=ON

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3 plugin
        uses: actions/upload-artifact@v4
        with:
          name: OrchestralStudioReverb-Windows-VST3
          path: build/OrchestralStudioReverb_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 14
